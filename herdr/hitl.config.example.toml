# Copy this example to ~/.config/herdr-hitl/config.toml and replace placeholders.
# Never commit the real file: it contains bot credentials in plaintext.

# Normal routing: "messenger" delivers, "terminal" refuses with exit 5,
# and "auto" follows the away marker. Human-declared `herdr-hitl afk`
# overrides every policy and refuses ask/notify with exit 6 and no answer.
# `here` clears AFK; `away` replaces it. AFK is a command, not a config value.
channel = "auto"

# Optional exact-label workspace routing (herdr-hitl 0.4.0+).
# HITL_CHANNEL and --channel take precedence; active AFK still overrides them.
# A workspace label may belong to only one route.
# [[workspace]]
# labels = ["example-workspace"]
# channel = "terminal"

[telegram]
bot_token = "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
chat_id = "REPLACE_WITH_TELEGRAM_CHAT_ID"
allowed_user_ids = ["REPLACE_WITH_TELEGRAM_USER_ID"]
api_base = "REPLACE_WITH_TELEGRAM_API_BASE_OR_REMOVE_THIS_LINE"

[discord]
bot_token = "REPLACE_WITH_DISCORD_BOT_TOKEN"
channel_id = "REPLACE_WITH_DISCORD_CHANNEL_ID_OR_REMOVE_THIS_LINE"
user_id = "REPLACE_WITH_DISCORD_USER_ID_OR_REMOVE_THIS_LINE"
allowed_user_ids = ["REPLACE_WITH_DISCORD_USER_ID"]
