# Agent Usage (usagebar) plugin config
# Path: herdr plugin config-dir usagebar

[notify]
enabled = true
# remaining % thresholds that may fire a toast (once per window/bucket)
remaining_thresholds = [50, 20, 10, 5]

[ui]
# remaining (default): % left / higher is safer. used: fill as you burn.
limit_percent = "remaining"

# Keep configured providers visible even when their panes are closed.
show_all_providers = true

# Provider ids the panel must never show, by profile id or family id. Neither
# harness is in use here, and hiding them also stops their collectors (and
# grok.com / opencode.ai lookups) from running at all.
hide_providers = ["opencode", "grok"]

# Multi-account Claude: uncomment and add one block per account.
# Absence of any profile keeps the single default account (fully backward
# compatible). config_dir must be unique per profile and may use ~.
#
# Once any profile exists, declare the default account too: bare `claude`
# sets no CLAUDE_CONFIG_DIR, so the ~/.claude account is only recorded if
# a profile claims that dir. `usagebar setup` warns when it is uncovered.
#
# OMP records OAuth usage windows in ~/.omp/agent/agent.db. Each profile's
# identity is read from its own local credentials, which are not published.
[[claude.profiles]]
id = "claude"
label = "personal"
config_dir = "~/.claude"
claude_json_path = "~/.claude.json"


# OMP Codex accounts are discovered automatically from agent.db and displayed
# separately; no profile is needed for them. Add profiles only for Codex CLI
# accounts in separate CODEX_HOME directories. Once any profile exists,
# declare the default ~/.codex home too because bare `codex` leaves CODEX_HOME
# unset. `usagebar setup` warns when it is uncovered.
#
# [[codex.profiles]]
# id = "codex"
# label = "personal"
# codex_home = "~/.codex"
#
# [[codex.profiles]]
# id = "dev"
# label = "product"
# codex_home = "~/.codex-dev"

