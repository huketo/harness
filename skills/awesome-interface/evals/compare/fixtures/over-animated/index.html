<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주문 대시보드</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1 class="reveal">주문 대시보드</h1>
  <button class="search-btn" id="open-search" type="button">검색 <kbd>/</kbd></button>
</header>

<section class="stats">
  <article class="stat lift"><h2>오늘 주문</h2><p class="num" data-value="1284">0</p></article>
  <article class="stat lift"><h2>매출(원)</h2><p class="num" data-value="38420000">0</p></article>
  <article class="stat lift"><h2>취소</h2><p class="num" data-value="17">0</p></article>
</section>

<div class="tabs" role="tablist" aria-label="주문 상태">
  <button role="tab" aria-selected="true" data-filter="all" type="button">전체</button>
  <button role="tab" aria-selected="false" data-filter="paid" type="button">결제 완료</button>
  <button role="tab" aria-selected="false" data-filter="shipping" type="button">배송 중</button>
  <span class="tab-ink" aria-hidden="true"></span>
</div>

<table class="orders">
  <thead><tr><th>주문 번호</th><th>고객</th><th>금액</th><th>상태</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<section class="panel" id="detail" hidden>
  <div class="panel-inner">
    <h2 id="detail-title">주문 상세</h2>
    <p id="detail-body"></p>
    <button class="save" id="mark" type="button">배송 처리</button>
    <span class="saved" id="saved" hidden>
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path class="tick" d="M4 10l4 4 8-8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      저장됨
    </span>
    <button class="close" id="close-detail" type="button">닫기</button>
  </div>
</section>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="주문 검색">
    <input id="search" type="search" placeholder="주문 번호나 고객 이름" aria-label="주문 검색">
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
