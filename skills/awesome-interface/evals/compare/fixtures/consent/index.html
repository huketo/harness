<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>위치 권한</title></head>
<body>
  <main>
    <span class="badge">Location access</span>
    <p class="eyebrow">주변 매장 추천</p>
    <h1>주변 매장을 추천받으세요</h1>
    <p class="sub">내 주변에 있는 매장을 추천해 드려요</p>
    <p class="body">지금 위치 권한을 허용하지 않으면 매일 받을 수 있는 할인 혜택을 놓치게 됩니다. 허용하시면 훨씬 안심하고 쇼핑을 즐기실 수 있을 거예요.</p>
    <p class="coupon">첫 방문 쿠폰은 3000원 할인이며 최소 주문 금액 15000원 이상 구매 시, 참여 매장에서만, 이번 주 일요일까지 사용 가능하고 1인당 1회만 사용할 수 있습니다.</p>
    <button id="allow" type="button">확인</button>
    <button id="deny" type="button">아니요, 할인은 필요 없어요</button>
  </main>
</body>
</html>
