<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>필터 시트</title>
<link rel="stylesheet" href="sheet.css">
</head>
<body>
<main class="page">
  <h1>근처 카페</h1>
  <button class="btn" id="open" type="button" aria-haspopup="dialog" aria-controls="sheet">필터</button>
  <ul class="results">
    <li>달빛 로스터리 · 320m</li>
    <li>오후의 서재 · 450m</li>
    <li>모퉁이 커피 · 610m</li>
    <li>숲길 베이커리 · 780m</li>
  </ul>
</main>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="handle-area" id="handle"><span class="handle" aria-hidden="true"></span></div>
  <header class="sheet-head">
    <h2 id="sheet-title">필터</h2>
    <button class="btn" id="close" type="button">닫기</button>
  </header>
  <div class="sheet-body">
    <fieldset>
      <legend>거리</legend>
      <label><input type="radio" name="dist" checked> 500m 이내</label>
      <label><input type="radio" name="dist"> 1km 이내</label>
      <label><input type="radio" name="dist"> 3km 이내</label>
    </fieldset>
    <fieldset>
      <legend>편의 시설</legend>
      <label><input type="checkbox"> 콘센트</label>
      <label><input type="checkbox"> 주차</label>
      <label><input type="checkbox"> 반려동물 동반</label>
      <label><input type="checkbox"> 노키즈존 아님</label>
      <label><input type="checkbox"> 테라스</label>
      <label><input type="checkbox"> 24시간</label>
    </fieldset>
    <button class="btn btn-primary" id="apply" type="button">적용</button>
  </div>
</section>
<script src="sheet.js"></script>
</body>
</html>
