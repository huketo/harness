<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>通知設定</title></head>
<body>
  <main>
    <span class="badge">Notification</span>
    <h1>通知をオンにしよう！</h1>
    <p class="sub">通知をオンにすると、大切なお知らせを受け取ることができます。</p>
    <p class="body">今すぐ通知を許可しないと、限定クーポンを見逃してしまいます。許可すれば毎日がもっとワクワクするはずです。</p>
    <p class="detail">クーポンは500円引きで、2000円以上の注文時、対象店舗のみ、今月末まで、お一人様1回限り利用可能です。</p>
    <p id="error" class="error" hidden>エラーが発生しました。</p>
    <button id="allow" type="button">OK</button>
    <button id="deny" type="button">いいえ、お得な情報はいりません</button>
  </main>
</body>
</html>
